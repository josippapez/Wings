# The plugins written in Rust: one crate each, in `<plugin>/rust/`, built to WebAssembly by `sh build-rust.sh`.
[workspace]
resolver = "3"
members = ["changes/rust", "claude-accounts/rust", "claude-chat/rust", "dev-servers/rust", "disk/rust", "hud/rust", "pr-tracker/rust", "schedules/rust", "share/rust", "tasks/rust", "work-item/rust", "worktrees/rust", "browser/rust"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# `sh build-rust.sh --quick`: a module in a few seconds instead of half a minute, for trying a change. Never committed.
[profile.quick]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
