[package]
name = "wings"
version = "0.1.119"
description = "Wings: a desktop home for Claude Code sessions"
authors = ["Josip Papez"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wings_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
bench-canvas = ["dep:wings-bench-grid"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
wings-agents = { path = "../../../crates/wings-agents" }
wings-plugin-storage = { path = "../../../crates/wings-plugin-storage" }
wings-plugins = { path = "../../../crates/wings-plugins" }
wings-terminal = { path = "../../../crates/wings-terminal" }
tauri-plugin-dialog = "2.8.1"
portable-pty = "0.9.0"
sysinfo = "0.39.6"
vte = "0.15.0"
anyhow = "1"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-notification = "2.5.1"
ureq = "3.4.2"
keyring = "4.2.0"
# Already built for Tauri; the CLI finds the app data folder the same way.
dirs = "7.0.0"
notify = "8"
# Only for the Rust-parsed canvas renderer prototype in the benchmark (`--features bench-canvas`).
wings-bench-grid = { path = "bench-grid", optional = true }
sha2 = "0.11"
# The disk scan walks folders on a work-stealing pool, which std has none of.
rayon = "1.12.0"


# Clicking a system notification focuses its pane: the plugin's builder can't wait for the click, notify-rust can.
[target.'cfg(target_os = "macos")'.dependencies]
notify-rust = "4.18"
# The disk scan asks APFS which files share blocks with a clone (getattrlist).
libc = "0.2"
# The terminal host's LaunchAgent goes through SMAppService, which has no C API. objc2 and objc2-foundation already come
# with Tauri.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSString"] }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService", "SMErrors", "objc2", "objc2-foundation"] }

# Self-update: desktop only (the plugins have no mobile support).
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "2.4.1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
# Thin LTO: most of the speed of full LTO, with a much faster final link.
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
