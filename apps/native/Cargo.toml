[package]
name = "wings-native"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["ui"]
ui = ["dep:gpui", "dep:gpui_platform", "dep:image", "dep:wings-terminal", "dep:wings-agents", "dep:async-channel", "dep:sysinfo", "dep:unicode-segmentation", "dep:chrono", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation", "dep:global-hotkey", "dep:raw-window-handle", "dep:syntect", "dep:two-face"]
# Headless GPUI windows for tests that send keys and mouse events through the real view.
test-support = ["ui", "gpui/test-support", "gpui_platform/test-support"]
# The build that replaces the desktop app: `Wings.app` on the desktop's data folder (`src/data_dir.rs`), made by
# `WINGS_SWITCH=1 sh scripts/build-mac-app.sh`.
switch = []

[[bin]]
name = "wings-native"
path = "src/main.rs"
required-features = ["ui"]

[[bin]]
name = "wings-plugin-worker"
path = "src/bin/wings-plugin-worker.rs"

# Runs the terminals apart from the app so they outlive it, unless Settings turns it off (`terminal_server.rs`).
# It ships beside `wings-native` in the bundle, and the app copies it out of the bundle before it runs it.
[[bin]]
name = "wings-terminal-server"
path = "src/bin/wings-terminal-server.rs"

# The `wings` command Claude Code runs (`wings --mcp`, `wings statusline`, `wings hook`) and the `wings` CLI, which talk to
# the running app over its socket. It ships beside `wings-native` in the bundle, and Claude Code's settings point at it.
[[bin]]
name = "wings"
path = "src/bin/wings.rs"

[dependencies]
diffy = { version = "=0.5.2", default-features = false }
wings-plugin-storage = { path = "../../crates/wings-plugin-storage" }
wings-terminal = { path = "../../crates/wings-terminal", features = ["grid", "images"], optional = true }
wings-agents = { path = "../../crates/wings-agents", optional = true }
wings-plugins = { path = "../../crates/wings-plugins" }
wings-disk-usage = { path = "../../crates/wings-disk-usage" }
wings-editors = { path = "../../crates/wings-editors" }
wings-gitwatch = { path = "../../crates/wings-gitwatch" }
wings-spaces = { path = "../../crates/wings-spaces" }
wings-connect = { path = "../../crates/wings-connect" }
wings-ptyd = { path = "../../crates/wings-ptyd" }
# The terminal server's folder must belong to this user (`getuid`).
libc = "0.2"
sysinfo = { version = "0.39.6", optional = true }
async-channel = { version = "2.5", optional = true }
unicode-segmentation = { version = "1.13", optional = true }
# "Today" in the history sheet is since midnight where you are, which std cannot say.
chrono = { version = "0.4", default-features = false, features = ["clock"], optional = true }
keyring = "4.2.0"
ureq = "3.4.2"
base64 = "0.22.1"
minisign-verify = "=0.2.5"
sha2 = "0.10.9"
semver = "1.0.28"
tar = "0.4.46"
flate2 = "1.1.10"
tempfile = "3.27.0"
plist = "1.10.1"
rquickjs = { version = "=0.14.0", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A diff's syntax colours (`diff/highlight.rs`): TextMate-style grammars, so the desktop's pierre-dark theme applies as is,
# and two-face adds bat's TypeScript, TSX, TOML and Dockerfile grammars that syntect's own set lacks.
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "dump-load", "regex-onig"], optional = true }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-onig"], optional = true }
# The frames of the images terminals draw, the version GPUI's own `RenderImage` is made of.
image = { version = "0.25.10", default-features = false, optional = true }
gpui = { package = "gpui-pre", version = "=0.3.11", default-features = false, optional = true }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", default-features = false, features = ["font-kit", "runtime_shaders", "wayland", "x11"], optional = true }

# Notification sounds play through AppKit's NSSound, and the window's vibrancy is AppKit's NSVisualEffectView.
# gpui-pre-macos already builds these exact versions with these features.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.5", optional = true }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSSound", "NSApplication", "NSResponder", "NSEvent", "NSWindow", "NSRunningApplication", "NSView", "NSVisualEffectView"], optional = true }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSArray", "NSGeometry"], optional = true }
# The window's AppKit view, for the desktop's vibrancy under the glass. gpui-pre already builds this version.
raw-window-handle = { version = "0.6.2", optional = true }
# The global shortcut, the version the desktop's tauri-plugin-global-shortcut uses: Carbon's RegisterEventHotKey.
global-hotkey = { version = "=0.8.0", optional = true }

[[example]]
name = "shot"
required-features = ["test-support"]

[[example]]
name = "shot_plugins"
required-features = ["test-support"]

[[example]]
name = "shot_diff"
required-features = ["test-support"]

[dev-dependencies]
# Builds .wings-plugin packages for the install tests; the version wings-plugins unpacks them with.
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[[example]]
name = "bench_redraw"
required-features = ["test-support"]

[[example]]
name = "bench_diff_scroll"
required-features = ["test-support"]
