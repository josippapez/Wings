[package]
name = "wings-native"
version = "0.2.132"
edition = "2024"
publish = false

[features]
default = ["ui"]
ui = ["dep:gpui", "dep:gpui_platform", "dep:image", "dep:objc2-metal", "dep:objc2-core-video", "dep:objc2-av-foundation", "dep:objc2-core-media", "dep:objc2-core-foundation", "dep:objc2-quartz-core", "dep:objc2-core-graphics", "dep:wings-terminal", "dep:wings-agents", "dep:async-channel", "dep:sysinfo", "dep:unicode-segmentation", "dep:chrono", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation", "dep:objc2-web-kit", "dep:objc2-core-services", "dep:block2", "dep:dispatch2", "dep:global-hotkey", "dep:wings-chromium", "dep:cef", "dep:raw-window-handle", "dep:syntect", "dep:two-face"]
# Headless GPUI windows for tests that send keys and mouse events through the real view.
test-support = ["ui", "gpui/test-support", "gpui_platform/test-support"]
# The build that replaces the desktop app: `Wings.app` on the desktop's data folder (`src/data_dir.rs`), made by
# `WINGS_SWITCH=1 sh scripts/build-mac-app.sh`.
switch = []
# Lets a release build take the Chromium engine's archive from the file `WINGS_CHROMIUM_ARCHIVE` names instead of
# downloading it (`web/engine.rs`); a debug build always does. The archive is still checked against the pinned size and hash.
chromium-local = []

[[bin]]
name = "wings-native"
path = "src/main.rs"
required-features = ["ui"]

[[bin]]
name = "wings-plugin-worker"
path = "src/bin/wings-plugin-worker.rs"

# Runs the terminals apart from the app so they outlive it, unless Settings turns it off (`terminal_server.rs`).
# It ships beside `wings-native` in the bundle, and the app copies it out of the bundle before it runs it.
[[bin]]
name = "wings-terminal-server"
path = "src/bin/wings-terminal-server.rs"

# Turns text into vectors for semantic search of past sessions, started by the app with the model it downloads
# (`wings_agents::semantic`). It ships beside `wings-native` in the bundle.
[[bin]]
name = "wings-embed"
path = "src/bin/wings-embed.rs"

# The `wings` command Claude Code runs (`wings --mcp`, `wings statusline`, `wings hook`) and the `wings` CLI, which talk to
# the running app over its socket. It ships beside `wings-native` in the bundle, and Claude Code's settings point at it.
[[bin]]
name = "wings"
path = "src/bin/wings.rs"

[dependencies]
diffy = { version = "=0.5.2", default-features = false }
wings-plugin-storage = { path = "../../crates/wings-plugin-storage" }
wings-terminal = { path = "../../crates/wings-terminal", features = ["grid", "images"], optional = true }
wings-agents = { path = "../../crates/wings-agents", optional = true }
wings-plugins = { path = "../../crates/wings-plugins" }
wings-disk-usage = { path = "../../crates/wings-disk-usage" }
wings-editors = { path = "../../crates/wings-editors" }
wings-gitwatch = { path = "../../crates/wings-gitwatch" }
wings-spaces = { path = "../../crates/wings-spaces" }
wings-connect = { path = "../../crates/wings-connect" }
wings-ptyd = { path = "../../crates/wings-ptyd" }
# The built-in Browser: another browser's cookies and extensions, read on the person's click (`web/`).
wings-browser-cookies = { path = "../../crates/wings-browser-cookies" }
wings-web-extensions = { path = "../../crates/wings-web-extensions" }
# The terminal server's folder must belong to this user (`getuid`).
libc = "0.2"
sysinfo = { version = "0.39.6", optional = true }
async-channel = { version = "2.5", optional = true }
unicode-segmentation = { version = "1.13", optional = true }
# "Today" in the history sheet is since midnight where you are, which std cannot say.
chrono = { version = "0.4", default-features = false, features = ["clock"], optional = true }
keyring = "4.2.0"
ureq = "3.4.2"
base64 = "0.22.1"
minisign-verify = "=0.2.5"
sha2 = "0.10.9"
# The Chromium engine's checks (`web/engine.rs`), which read all 357 MB of it before every start of Chromium: 0.11 uses
# Apple silicon's SHA-256 instructions, which 0.10 uses only with its `asm` feature and another crate. The version the
# extensions' crate already builds.
sha2-0-11 = { package = "sha2", version = "0.11.1" }
semver = "1.0.28"
tar = "0.4.46"
flate2 = "1.1.10"
tempfile = "3.27.0"
plist = "1.10.1"
# The semantic search helper (`src/bin/wings-embed.rs`), and only it: ONNX Runtime, whose prebuilt static library its build
# downloads once into ~/Library/Caches/ort.pyke.io (about 80 MB), and Hugging Face's tokenizer.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-rustls", "api-31"] }
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
# Runs a plugin page built to WebAssembly (`page/runtime/wasm.rs`): the trial of Rust plugins. An LTS release (48, a
# multiple of 12, supported until August 2028), kept at its latest patch: 48.0.9 fixed a guest aborting the process in
# builds without the `gc` feature, which this is (GHSA-rc4p-x33f-vpr2). With the compiler and nothing else of its
# defaults (no WASI, component model, async or cache).
wasmtime = { version = "=48.0.10", default-features = false, features = ["runtime", "cranelift", "std", "anyhow"] }
# Signs the compiled code kept on disk (`page/runtime/wasm.rs`), which runs unchecked when read back.
hmac = "0.12.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A diff's syntax colours (`diff/highlight.rs`): TextMate-style grammars, so the desktop's pierre-dark theme applies as is,
# and two-face adds bat's TypeScript, TSX, TOML and Dockerfile grammars that syntect's own set lacks.
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "dump-load", "regex-onig"], optional = true }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-onig"], optional = true }
# The frames of the images terminals draw, the version GPUI's own `RenderImage` is made of.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"], optional = true }
gpui = { package = "gpui-pre", version = "=0.3.13", default-features = false, optional = true }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.13", default-features = false, features = ["font-kit", "runtime_shaders", "wayland", "x11"], optional = true }

# Notification sounds play through AppKit's NSSound, and the window's vibrancy is AppKit's NSVisualEffectView.
# gpui-pre-macos already builds these exact versions with these features.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.5", optional = true }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSSound", "NSApplication", "NSResponder", "NSEvent", "NSWindow", "NSRunningApplication", "NSView", "NSVisualEffectView", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSOpenPanel", "NSSavePanel", "NSPanel", "NSAlert", "NSTextField", "NSControl", "NSButton", "NSCell", "NSTextFieldCell", "NSActionCell", "NSPopover", "NSScreen", "NSWorkspace"], optional = true }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSArray", "NSGeometry", "NSBundle", "NSString", "NSError", "NSValue", "NSDate", "NSDictionary", "NSHTTPCookie", "NSKeyValueObserving", "NSSet", "NSURL", "NSURLRequest", "NSUUID", "NSObject", "NSValue", "NSProcessInfo", "NSJSONSerialization", "NSRunLoop", "NSNotification", "NSProgress", "NSURLResponse", "block2"], optional = true }
# Web pages in plugin pages (`web/mac.rs`): WKWebView, its data stores and, on macOS 15.4, its extensions.
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKWebsiteDataRecord", "WKHTTPCookieStore", "WKNavigation", "WKNavigationAction", "WKNavigationDelegate", "WKUIDelegate", "WKWindowFeatures", "WKWebExtension", "WKWebExtensionContext", "WKWebExtensionController", "WKWebExtensionControllerConfiguration", "WKWebExtensionPermission", "WKWebExtensionMatchPattern", "WKWebExtensionAction", "WKWebExtensionTab", "WKWebExtensionWindow", "WKWebExtensionControllerDelegate", "WKContentWorld", "WKFrameInfo", "WKSnapshotConfiguration", "WKUIDelegate", "WKOpenPanelParameters", "WKScriptMessage", "WKScriptMessageHandler", "WKUserContentController", "WKUserScript", "WKSecurityOrigin", "WKWebExtensionDataRecord", "WKWebExtensionDataType", "WKDownload", "WKDownloadDelegate", "WKNavigationResponse", "WKPreferences"], optional = true }
# The quarantine a download is marked with, as from the web (`web/downloads.rs`): LaunchServices' keys for it.
objc2-core-services = { version = "0.3.2", default-features = false, features = ["std", "LaunchServices", "LSQuarantine"], optional = true }
block2 = { version = "0.6.2", optional = true }
# Back to the main thread from a check of the extensions off it (`web/mac.rs`); objc2-core-foundation already builds it.
dispatch2 = { version = "0.3.1", optional = true }
# The gradient backgrounds' shader (`ui/shader.rs`): Metal draws frames into Core Video buffers GPUI draws as surfaces.
# gpui-pre-apple already builds these exact versions.
objc2-metal = { version = "0.3.2", default-features = false, features = ["std", "MTLAllocation", "MTLBuffer", "MTLCommandBuffer", "MTLCommandEncoder", "MTLCommandQueue", "MTLDevice", "MTLDrawable", "MTLLibrary", "MTLPixelFormat", "MTLRenderCommandEncoder", "MTLRenderPass", "MTLRenderPipeline", "MTLResource", "MTLTexture", "MTLTypes"], optional = true }
# The layer under the window the app draws the backgrounds in (`ui/native_backdrop.rs`), and the spinners turning in Core
# Animation over GPUI's drawing (`ui/native_spinners.rs`): shape layers, a rotation animation, their paths and colours.
# gpui-pre-apple already builds these versions, with quartz-core's `objc2-core-graphics` on.
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer", "CAMetalLayer", "CATransaction", "CAShapeLayer", "CAAnimation", "CAMediaTiming", "objc2-core-foundation", "objc2-core-graphics", "objc2-metal"], optional = true }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGColor", "CGColorSpace", "CGPath", "objc2"], optional = true }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVMetalTexture", "CVMetalTextureCache", "CVReturn", "objc2", "objc2-metal"], optional = true }
# Writes the Browser's screen recordings as H.264 .mp4 (`web/record.rs`): AVAssetWriter comes with macOS, where no ffmpeg
# can be counted on.
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "AVAssetWriter", "AVAssetWriterInput", "AVMediaFormat", "AVVideoSettings", "objc2-core-media", "objc2-core-video"], optional = true }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "CMTime"], optional = true }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFBase", "CFDictionary", "CFNumber", "CFString", "CFCGTypes"], optional = true }
# The window's AppKit view, for the desktop's vibrancy under the glass. gpui-pre already builds this version.
raw-window-handle = { version = "0.6.2", optional = true }
# The global shortcut, the version the desktop's tauri-plugin-global-shortcut uses: Carbon's RegisterEventHotKey.
global-hotkey = { version = "=0.8.0", optional = true }
# The Browser's opt-in Chromium engine (`web/chromium/`): CEF's bindings and C++ wrapper, which load the framework
# Wings downloads (`web/engine.rs`) at run time; the app links no framework and holds no CEF file. Building it needs
# cmake and ninja, and CEF's SDK: `CEF_PATH` names an exported copy, or cef-dll-sys downloads one (about 130 MB) into
# its build folder.
wings-chromium = { path = "../../crates/wings-chromium", optional = true }
cef = { version = "=158.0.0", default-features = false, features = ["sandbox"], optional = true }

[[example]]
name = "shot"
required-features = ["test-support"]

[[example]]
name = "shot_plugins"
required-features = ["test-support"]

[[example]]
name = "shot_diff"
required-features = ["test-support"]

[[example]]
name = "trial_wasm_page"
required-features = ["test-support"]

[dev-dependencies]
# Builds .wings-plugin packages for the install tests; the version wings-plugins unpacks them with.
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

# Debug builds (tests, screenshot runs, `cargo run`) compile plugin modules with an optimised Cranelift: unoptimised, it
# took 26 s for Claude chat's modules on every screenshot run.
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.cranelift-frontend]
opt-level = 3
[profile.dev.package.cranelift-entity]
opt-level = 3
[profile.dev.package.cranelift-bforest]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3
[profile.dev.package.wasmparser]
opt-level = 3
[profile.dev.package.wasmtime-environ]
opt-level = 3
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3
[profile.dev.package.wasmtime]
opt-level = 3
# And save screenshots with an optimised PNG encoder: unoptimised, each took 0.6 s, a third of a screenshot run.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.simd-adler32]
opt-level = 3
[profile.dev.package.adler2]
opt-level = 3
# And check the Chromium engine's 357 MB before it starts (`web/engine.rs`) with an optimised SHA-256: unoptimised, a debug
# build's Chromium pages waited 3.4 s for it.
[profile.dev.package.sha2]
opt-level = 3

