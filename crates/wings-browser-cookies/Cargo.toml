[package]
name = "wings-browser-cookies"
version = "0.1.0"
edition = "2021"
description = "Reads the cookies of the other browsers on this Mac (Chromium family, Firefox, Safari) so the built-in Browser can import them"
publish = false

[dependencies]
serde_json = "1"
# Chromium's Mac cookie encryption: AES-128-CBC with a PBKDF2-HMAC-SHA1 key. Same majors as apps/native/Cargo.lock.
aes = "0.8"
cbc = "0.1"
# The only SHA-1 already in the lock; PBKDF2 is a few lines on top of it (see crypto.rs), so no new crate compiles.
sha1_smol = "1"
sha2 = "0.10"
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
# The Keychain read runs inside this process, so the system prompt names Wings, not a helper tool.
security-framework = { version = "3", default-features = false }
