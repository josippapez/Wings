[package]
name = "wings-terminal"
version = "0.1.0"
edition = "2021"
description = "Shared Wings PTY process and optional terminal grid"
publish = false

[features]
grid = ["dep:alacritty_terminal"]

[dependencies]
anyhow = "1"
portable-pty = "0.9.0"
alacritty_terminal = { version = "0.26.0", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
