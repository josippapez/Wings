[package]
name = "wings-agents"
version = "0.1.0"
edition = "2021"
description = "Shared Wings agent detection: Claude Code, opencode and Codex in terminal panes"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
dirs = "7.0.0"
sysinfo = "0.39.6"
ureq = "3.4.2"
# The on-device helper is rebuilt when its source changes, named after the source's hash (`ai.rs`).
sha2 = "0.11"

[dev-dependencies]
portable-pty = "0.9.0"
