[package]
name = "wings-spaces"
version = "0.1.0"
edition = "2021"
description = "The projects in a Wings sidebar and their git worktrees: the project list file, worktree creation and setup"
publish = false

[lib]
name = "wings_spaces"

[dependencies]
serde = { version = "1", features = ["derive"] }
# An account's `settings.json` copy keeps the default account's key order.
serde_json = { version = "1", features = ["preserve_order"] }
# Names a project's folder in the Project page's data.
sha2 = "0.11"
# `find_program` finds git the way the plugin runner finds any program.
wings-plugins = { path = "../wings-plugins" }
