<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Spike sample login</title>
</head>
<body>
  <h1>Sample login (local test page)</h1>
  <form id="login" action="/login" method="post" autocomplete="on">
    <label>Username <input id="username" name="username" type="text" autocomplete="username"></label>
    <label>Password <input id="password" name="password" type="password" autocomplete="current-password"></label>
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
