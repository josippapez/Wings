[package]
name = "wings-web-extensions"
version = "0.1.0"
edition = "2021"
description = "Browser extensions for the built-in Browser: find the ones installed in other browsers, read manifests, unpack store packages and work out store download URLs"
publish = false

[dependencies]
serde_json = "1"
url = "2.5.8"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
