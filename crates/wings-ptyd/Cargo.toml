[package]
name = "wings-ptyd"
version = "0.1.0"
edition = "2021"
description = "The Wings terminal server: a process that owns the terminals so they outlive the app, its socket protocol, and a client"
publish = false

[dependencies]
anyhow = "1"
libc = "0.2"
portable-pty = "0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vte = "0.15.0"
# Codex's lifecycle reports (OSC 7501), kept per pane while no app is attached.
wings-agents = { path = "../wings-agents" }
wings-terminal = { path = "../wings-terminal" }
